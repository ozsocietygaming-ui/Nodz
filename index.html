const state = {
  lang: (navigator.language || "ar").startsWith("fr") ? "fr" : (navigator.language || "ar").startsWith("en") ? "en" : "ar",
  mode: "request",
  wilayaFilter: "all",

};

function t(key) { return I18N[state.lang][key] || key; }

function myPostIds() {
  try { return JSON.parse(localStorage.getItem("nodz_my_posts") || "[]"); } catch(e) { return []; }
}
function addMyPost(id, wilayaCode) {
  const list = myPostIds();
  list.push({ id, wilayaCode });
  localStorage.setItem("nodz_my_posts", JSON.stringify(list));
}
function removeMyPost(id) {
  const list = myPostIds().filter(p => p.id !== id);
  localStorage.setItem("nodz_my_posts", JSON.stringify(list));
}
function isMyPost(id) {
  return myPostIds().some(p => p.id === id);
}

function wilayaName(code) {
  const w = WILAYAS.find(w => w.c === Number(code));
  if (!w) return "";
  return state.lang === "ar" ? w.ar : w.fr;
}

function normalizePhone(raw) {
  return raw.replace(/[\s\-\.]/g, "");
}
function isValidAlgerianPhone(raw) {
  const clean = normalizePhone(raw);
  return /^0[567]\d{8}$/.test(clean);
}
function toWhatsAppLink(rawPhone, greetingText) {
  const clean = normalizePhone(rawPhone);
  const intl = "213" + clean.slice(1);
  return `https://wa.me/${intl}?text=${encodeURIComponent(greetingText)}`;
}

function timeAgo(ts) {
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return t("justNow");
  if (min < 60) return `${min} ${t("minAgo")}`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs} ${t("hAgo")}`;
  const days = Math.floor(hrs / 24);
  return `${days} ${t("dAgo")}`;
}

function timeLeft(expiresAt) {
  const diff = expiresAt - Date.now();
  if (diff <= 0) return null;
  const min = Math.ceil(diff / 60000);
  if (min < 60) return `${min} ${state.lang === "ar" ? "د" : "min"}`;
  const hrs = Math.ceil(min / 60);
  return `${hrs} ${state.lang === "ar" ? "س" : "h"}`;
}

function expMillis(choice) {
  const now = Date.now();
  switch(choice) {
    case "1h": return now + 3600e3;
    case "3h": return now + 3 * 3600e3;
    case "today": {
      const d = new Date();
      d.setHours(23,59,59,999);
      return d.getTime();
    }
    case "24h": return now + 24 * 3600e3;
    default: return now + 3 * 3600e3;
  }
}

function buildWilayaOptions() {
  const filterSel = document.getElementById("wilayaFilter");

  optAll.value = "all";
  optAll.textContent = t("allWilayas");
  filterSel.appendChild(optAll);
  WILAYAS.forEach(w => {
    const label = `${w.c} — ${state.lang === "ar" ? w.ar : w.fr}`;
    const o1 = document.createElement("option");
    o1.value = w.c; o1.textContent = label;
    filterSel.appendChild(o1);
    const o2 = document.createElement("option");
    o2.value = w.c; o2.textContent = label;
    formSel.appendChild(o2);
  });
  filterSel.value = prevFilter;
  formSel.value = prevForm !== "all" ? prevForm : "34";

document.getElementById("postForm").addEventListener("submit", e => {
  e.preventDefault();
  const title = document.getElementById("titleInput").value.trim();
  const details = document.getElementById("detailsInput").value.trim();
  const category = document.getElementById("categorySelect").value;
  const wilayaCode = document.getElementById("wilayaSelect").value;
  const commune = document.getElementById("communeInput").value.trim();
  const phone = document.getElementById("phoneInput").value.trim();
  const errEl = document.getElementById("phoneError");

  if (!title || !category || !wilayaCode || !commune || !phone) {
    showToast(t("toastFillFields"), "warn");
    return;
  }
  if (!isValidAlgerianPhone(phone)) {
    errEl.classList.remove("hidden");
    return;
  }
  errEl.classList.add("hidden");

  const post = {
    mode: state.formMode,
    category,
    title,
    details,
    wilayaCode: Number(wilayaCode),
    commune,
    phone: normalizePhone(phone),
    createdAt: Date.now(),
    expiresAt: expMillis(state.expChoice),
    fulfilled: false
  };

  const postsRef = ref(db, `posts/${wilayaCode}`);
  push(postsRef, post).then(snap => {
    addMyPost(snap.key, wilayaCode);
    closeModal();
    showToast(t("toastPostCreated"), "success");
  }).catch(() => {
    showToast(t("toastFillFields"), "warn");
  });
});

document.getElementById("phoneInput").addEventListener("input", () => {
  document.getElementById("phoneError").classList.add("hidden");
});

function showToast(msg, kind = "info") {
  const wrap = document.getElementById("toastContainer");
  const el = document.createElement("div");
  const colors = {
    success: "bg-moss-600",
    warn: "bg-urgent-600",
    info: "bg-ink"
  };
  el.className = `${colors[kind] || colors.info} text-white text-sm font-semibold px-4 py-2.5 rounded-full shadow-soft animate-toastin pointer-events-auto flex items-center gap-2`;
  const iconMap = { success: "check-circle", warn: "alert-circle", info: "radio" };
  el.innerHTML = `<i data-lucide="${iconMap[kind] || "radio"}" class="w-4 h-4"></i><span>${msg}</span>`;
  wrap.appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => {
    el.style.transition = "opacity .3s, transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function attachFirebaseListener() {
  if (state.activeWilayaRef) {
    off(state.activeWilayaRef);
  }
  state.posts = {};
  state.firstLoadDone = false;

  const path = state.wilayaFilter === "all" ? "posts" : `posts/${state.wilayaFilter}`;
  const dataRef = ref(db, path);
  state.activeWilayaRef = dataRef;

  onValue(dataRef, snapshot => {
    const val = snapshot.val() || {};
    const flat = {};
    if (state.wilayaFilter === "all") {
      Object.keys(val).forEach(wCode => {
        const posts = val[wCode] || {};
        Object.keys(posts).forEach(pid => {
          flat[pid] = { ...posts[pid], _id: pid, _wilayaCode: Number(wCode) };
        });
      });
    } else {
      Object.keys(val).forEach(pid => {
        flat[pid] = { ...val[pid], _id: pid, _wilayaCode: Number(state.wilayaFilter) };
      });
    }
    state.posts = flat;
    renderFeed();
    state.firstLoadDone = true;
  });

  onChildAdded(dataRef, () => {
    if (!state.firstLoadDone) return;
    if (state.wilayaFilter !== "all") showToast(t("toastNewPost"), "info");
    pulseHero();
  }, () => {});
}

function renderFeed() {
  const grid = document.getElementById("feedGrid");
  const empty = document.getElementById("emptyState");
  const now = Date.now();

  let list = Object.values(state.posts).filter(p => {
    if (p.mode !== state.mode) return false;
    if (p.fulfilled) return false;
    if (p.expiresAt && p.expiresAt < now) return false;
    if (state.categoryFilter !== "all" && p.category !== state.categoryFilter) return false;
    if (state.search) {
      const hay = `${p.title || ""} ${p.details || ""} ${p.commune || ""}`.toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  });

  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  grid.innerHTML = "";

  if (list.length === 0) {
    empty.classList.remove("hidden");
    empty.classList.add("flex");
    if (window.lucide) lucide.createIcons();
    return;
  }
  empty.classList.add("hidden");
  empty.classList.remove("flex");

  list.forEach(post => grid.appendChild(renderCard(post)));
  if (window.lucide) lucide.createIcons();
}

function renderCard(post) {

  const waText = post.mode === "request" ? t("waGreetingRequest") : t("waGreetingService");
  const waLink = toWhatsAppLink(post.phone, `${waText} "${post.title}"`);
  const telLink = `tel:${post.phone}`;

  const badgeColor = post.mode === "request" ? "bg-urgent-50 text-urgent-600" : "bg-moss-50 text-moss-700";

  card.innerHTML = `
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full ${badgeColor} flex items-center justify-center shrink-0">
          <i data-lucide="${cat.icon}" class="w-4.5 h-4.5"></i>
        </div>
        <div>
          <p class="text-[11px] font-bold ${post.mode === "request" ? "text-urgent-600" : "text-moss-700"}">${t("cat_" + cat.k)}</p>
          <p class="text-[11px] text-inkfaint">${wilayaName(post._wilayaCode)} · ${post.commune || ""}</p>
        </div>
      </div>
      <span class="text-[10px] text-inkfaint whitespace-nowrap">${timeAgo(post.createdAt || Date.now())}</span>
    </div>
    <div>
      <h3 class="font-display font-bold text-sm text-ink leading-snug">${escapeHtml(post.title)}</h3>
      ${post.details ? `<p class="text-xs text-inks mt-1 leading-relaxed">${escapeHtml(post.details)}</p>` : ""}
    </div>
    <div class="flex items-center justify-between text-[11px] text-inkfaint">
      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${left ? `${t("expiresIn")} ${left}` : t("expired")}</span>
    </div>
    <div class="flex gap-2 mt-1">
      <a href="${telLink}" class="flex-1 flex items-center justify-center gap-1.5 bg-ink text-white text-xs font-bold py-2.5 rounded-xl hover:opacity-90 transition-opacity">
        <i data-lucide="phone" class="w-3.5 h-3.5"></i>${t("callNow")}
      </a>
      <a href="${waLink}" target="_blank" rel="noopener" class="flex-1 flex items-center justify-center gap-1.5 bg-moss-500 text-white text-xs font-bold py-2.5 rounded-xl hover:bg-moss-600 transition-colors">
        <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>${t("whatsapp")}
      </a>
    </div>
    ${mine ? `
    <div class="flex gap-2 pt-2 border-t border-clay2">
      <button data-action="fulfill" data-id="${post._id}" data-wc="${post._wilayaCode}" class="flex-1 text-[11px] font-bold text-moss-700 bg-moss-50 py-2 rounded-lg hover:bg-moss-100 transition-colors">${t("markFulfilled")}</button>
      <button data-action="delete" data-id="${post._id}" data-wc="${post._wilayaCode}" class="flex-1 text-[11px] font-bold text-urgent-600 bg-urgent-50 py-2 rounded-lg hover:bg-urgent-100 transition-colors">${t("deleteBtn")}</button>
    </div>` : ""}
  `;
  return card;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

document.getElementById("feedGrid").addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const wc = btn.dataset.wc;
  const postRef = ref(db, `posts/${wc}/${id}`);
  if (btn.dataset.action === "delete") {
    remove(postRef).then(() => {
      removeMyPost(id);
      showToast(t("toastPostDeleted"), "info");
    });
  } else if (btn.dataset.action === "fulfill") {
    update(postRef, { fulfilled: true }).then(() => {
      showToast(t("toastPostFulfilled"), "success");
    });
  }
});

function pulseHero() {
  heroPulseFlag = true;
}
let heroPulseFlag = false;

function setupLogoCanvas() {
  const canvas = document.getElementById("logoCanvas");
  const ctx = canvas.getContext("2d");
  const nodes = [{x:9,y:10,r:4,c:"#1F8A5F"},{x:26,y:14,r:3,c:"#2D7D9A"},{x:15,y:26,r:3.4,c:"#E8935A"}];
  ctx.strokeStyle = "#1F8A5F55";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[1].x, nodes[1].y);
  ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[2].x, nodes[2].y);
  ctx.stroke();
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.c;
    ctx.fill();
  });
}

function setupHeroCanvas() {
  const canvas = document.getElementById("heroCanvas");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h;
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  }
  resize();
  window.addEventListener("resize", resize);

  const N = 22;
  const nodes = Array.from({length: N}, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.0004,
    vy: (Math.random() - 0.5) * 0.0004,
    pulse: Math.random() * Math.PI * 2
  }));
  const palette = ["#1F8A5F", "#2D7D9A", "#E8935A"];

  function frame() {
    ctx.clearRect(0, 0, w, h);
    nodes.forEach(n => {
      if (!reduceMotion) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > 1) n.vx *= -1;
        if (n.y < 0 || n.y > 1) n.vy *= -1;
        n.pulse += 0.01;
      }
    });
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = (a.x - b.x) * w, dy = (a.y - b.y) * h;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = w * 0.16;
        if (dist < maxDist) {
          ctx.strokeStyle = `rgba(31,138,95,${(1 - dist / maxDist) * 0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x * w, a.y * h);
          ctx.lineTo(b.x * w, b.y * h);
          ctx.stroke();
        }
      }
    }
    nodes.forEach((n, i) => {
      const boost = heroPulseFlag && i % 5 === 0 ? 1.8 : 1;
      const r = (2 + Math.sin(n.pulse) * 0.8) * (w / 900) * boost;
      ctx.beginPath();
      ctx.arc(n.x * w, n.y * h, Math.max(r, 1.5), 0, Math.PI * 2);
      ctx.fillStyle = palette[i % palette.length] + "66";
      ctx.fill();
    });
    heroPulseFlag = false;
    requestAnimationFrame(frame);
  }
  frame();
}

setInterval(() => {
  renderFeed();
}, 30000);

setupLogoCanvas();
setupHeroCanvas();
attachFirebaseListener();
refreshModeStyles();
applyLangToDom();
if (window.lucide) lucide.createIcons();
</script>

  if (window.lucide) lucide.createIcons();
</script>
