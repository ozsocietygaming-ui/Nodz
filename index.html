// Official commune list (58 wilayas / 1541 communes), loaded at runtime from the
// AbderrahmeneDZ/Wilaya-Of-Algeria open dataset (Algerian Interior Ministry sourced)
// via jsDelivr's GitHub CDN mirror, instead of being hand-typed here.
const COMMUNES_SOURCE_URL = "https://cdn.jsdelivr.net/gh/AbderrahmeneDZ/Wilaya-Of-Algeria@master/Commune_Of_Algeria.json";
const DEFAULT_COMMUNE_MATCH = "ras el oued";

function stripDiacritics(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

async function loadCommunesData() {
  try {
    const res = await fetch(COMMUNES_SOURCE_URL);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    const byWilaya = {};
    data.forEach(row => {
      const code = String(row.wilaya_id);
      if (!byWilaya[code]) byWilaya[code] = [];
      byWilaya[code].push({ fr: row.name, ar: row.ar_name && row.ar_name.trim() ? row.ar_name : row.name });
    });
    Object.keys(byWilaya).forEach(code => {
      byWilaya[code].sort((a, b) => a.fr.localeCompare(b.fr));
    });
    state.communesByWilaya = byWilaya;
    state.communesLoaded = true;
  } catch (e) {
    state.communesLoaded = false;
    console.warn("Nodz: could not load commune list, falling back to free text", e);
    const fallbackInput = document.createElement("input");
    fallbackInput.type = "text";
    fallbackInput.id = "communeInput";
    fallbackInput.required = true;
    fallbackInput.className = "w-full bg-white border border-clay2 rounded-xl py-2.5 px-3 text-sm";
    fallbackInput.placeholder = t("communePlaceholder");
    fallbackInput.value = "Ras El Oued";
    const current = document.getElementById("communeInput");
    current.replaceWith(fallbackInput);
  }
  populateCommuneSelect(document.getElementById("communeFilter"), state.wilayaFilter, true, state.communeFilter);
  syncFormCommuneSelect();
}

function populateCommuneSelect(selectEl, wilayaCode, includeAll, preserveValue) {
  if (!selectEl) return;
  selectEl.innerHTML = "";
  if (includeAll) {
    const optAll = document.createElement("option");
    optAll.value = "all";
    optAll.textContent = t("allCommunes");
    selectEl.appendChild(optAll);
  }
  if (!state.communesLoaded) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.disabled = !includeAll;
    opt.textContent = t("communeLoading");
    selectEl.appendChild(opt);
    return;
  }
  const list = (wilayaCode && wilayaCode !== "all") ? (state.communesByWilaya[String(wilayaCode)] || []) : [];
  const source = includeAll && (!wilayaCode || wilayaCode === "all")
    ? Object.values(state.communesByWilaya).flat()
    : list;
  const seen = new Set();
  source.forEach(c => {
    if (seen.has(c.fr)) return;
    seen.add(c.fr);
    const o = document.createElement("option");
    o.value = c.fr;
    o.textContent = state.lang === "ar" ? c.ar : c.fr;
    selectEl.appendChild(o);
  });
  if (preserveValue && seen.has(preserveValue)) {
    selectEl.value = preserveValue;
  } else if (includeAll) {
    selectEl.value = "all";
  }
}

function syncFormCommuneSelect() {
  const sel = document.getElementById("communeInput");
  if (!sel || sel.tagName !== "SELECT") return;
  const wilayaCode = document.getElementById("wilayaSelect").value;
  const prevValue = sel.value;
  populateCommuneSelect(sel, wilayaCode, false, prevValue);
  if (!state.communesLoaded) return;
  const list = state.communesByWilaya[String(wilayaCode)] || [];
  const hasPrev = list.some(c => c.fr === prevValue);
  if (!hasPrev) {
    const defaultMatch = list.find(c => stripDiacritics(c.fr) === DEFAULT_COMMUNE_MATCH);
    if (defaultMatch) sel.value = defaultMatch.fr;
  }
}

function communeLabel(wilayaCode, canonicalName) {
  if (!canonicalName) return "";
  const list = state.communesByWilaya[String(wilayaCode)] || [];
  const match = list.find(c => c.fr === canonicalName);
  if (!match) return canonicalName;
  return state.lang === "ar" ? match.ar : match.fr;
}

const FLAG_THRESHOLD = 10;
const FREQUENT_THRESHOLD = 5;
const RATE_LIMIT_MAX = 1;
const RATE_LIMIT_WINDOW_MS = 10 * 60 * 1000;

function myFlaggedIds() {
  try { return JSON.parse(localStorage.getItem("nodz_flagged") || "[]"); } catch(e) { return []; }
}
function hasFlagged(id) { return myFlaggedIds().includes(id); }
function markFlagged(id) {
  const list = myFlaggedIds();
  list.push(id);
  localStorage.setItem("nodz_flagged", JSON.stringify(list));
}

function myRecentPostTimes() {
  try { return JSON.parse(localStorage.getItem("nodz_post_times") || "[]"); } catch(e) { return []; }
}
function isRateLimited() {
  const now = Date.now();
  const recent = myRecentPostTimes().filter(ts => now - ts < RATE_LIMIT_WINDOW_MS);
  return recent.length >= RATE_LIMIT_MAX;
}
function recordPostTime() {
  const now = Date.now();
  const recent = myRecentPostTimes().filter(ts => now - ts < RATE_LIMIT_WINDOW_MS);
  recent.push(now);
  localStorage.setItem("nodz_post_times", JSON.stringify(recent));
}

function phoneKey(phone) { return "p" + phone; }

function t(key) { return I18N[state.lang][key] || key; }

function myPostIds() {
  try { return JSON.parse(localStorage.getItem("nodz_my_posts") || "[]"); } catch(e) { return []; }
}
function addMyPost(id, wilayaCode) {
  const list = myPostIds();
  list.push({ id, wilayaCode });
  localStorage.setItem("nodz_my_posts", JSON.stringify(list));
}
function removeMyPost(id) {
  const list = myPostIds().filter(p => p.id !== id);
  localStorage.setItem("nodz_my_posts", JSON.stringify(list));
}
function isMyPost(id) {
  return myPostIds().some(p => p.id === id);
}

function wilayaName(code) {
  const w = WILAYAS.find(w => w.c === Number(code));
  if (!w) return "";
  return state.lang === "ar" ? w.ar : w.fr;
}

function normalizePhone(raw) {
  return raw.replace(/[\s\-\.]/g, "");
}
function isValidAlgerianPhone(raw) {
  const clean = normalizePhone(raw);
  return /^0[567]\d{8}$/.test(clean);
}
function toWhatsAppLink(rawPhone, greetingText) {
  const clean = normalizePhone(rawPhone);
  const intl = "213" + clean.slice(1);
  return `https://wa.me/${intl}?text=${encodeURIComponent(greetingText)}`;
}

function timeAgo(ts) {
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return t("justNow");
  if (min < 60) return `${min} ${t("minAgo")}`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs} ${t("hAgo")}`;
  const days = Math.floor(hrs / 24);
  return `${days} ${t("dAgo")}`;
}

function timeLeft(expiresAt) {
  const diff = expiresAt - Date.now();
  if (diff <= 0) return null;
  const min = Math.ceil(diff / 60000);
  if (min < 60) return `${min} ${state.lang === "ar" ? "د" : "min"}`;
  const hrs = Math.ceil(min / 60);
  return `${hrs} ${state.lang === "ar" ? "س" : "h"}`;
}

function expMillis(choice) {
  const now = Date.now();
  switch(choice) {
    case "1h": return now + 3600e3;
    case "3h": return now + 3 * 3600e3;
    case "today": {
      const d = new Date();
      d.setHours(23,59,59,999);
      return d.getTime();
    }
    case "24h": return now + 24 * 3600e3;
    default: return now + 3 * 3600e3;
  }
}

document.getElementById("postForm").addEventListener("submit", e => {

  const wilayaCode = document.getElementById("wilayaSelect").value;

  const phone = document.getElementById("phoneInput").value.trim();
  const errEl = document.getElementById("phoneError");

  if (!title || !category || !wilayaCode || !commune || !phone) {
    showToast(t("toastFillFields"), "warn");
    return;
  }
  if (!isValidAlgerianPhone(phone)) {
    errEl.classList.remove("hidden");
    return;
  }
  errEl.classList.add("hidden");

  if (isRateLimited()) {
    const recent = myRecentPostTimes().filter(ts => Date.now() - ts < RATE_LIMIT_WINDOW_MS);
    const oldest = Math.min(...recent);
    const remainingMin = Math.max(1, Math.ceil((RATE_LIMIT_WINDOW_MS - (Date.now() - oldest)) / 60000));
    showToast(`${t("rateLimitToast")} (${remainingMin} ${state.lang === "ar" ? "د" : "min"})`, "warn");
    return;
  }

  const post = {
    mode: state.formMode,
    category,
    title,
    details,
    wilayaCode: Number(wilayaCode),
    commune,
    phone: normalizePhone(phone),
    createdAt: Date.now(),
    expiresAt: expMillis(state.expChoice),
    fulfilled: false
  };

  const cleanPhone = normalizePhone(phone);
  const postsRef = ref(db, `posts/${wilayaCode}`);
  push(postsRef, post).then(snap => {
    addMyPost(snap.key, wilayaCode);
    recordPostTime();
    update(ref(db, `phoneStats/${phoneKey(cleanPhone)}`), { count: increment(1) });
    closeModal();

function attachFirebaseListener() {
  if (state.activeWilayaRef) {
    off(state.activeWilayaRef);
  }
  state.posts = {};
  state.firstLoadDone = false;

  const path = state.wilayaFilter === "all" ? "posts" : `posts/${state.wilayaFilter}`;
  const dataRef = ref(db, path);
  state.activeWilayaRef = dataRef;

  onValue(dataRef, snapshot => {
    const val = snapshot.val() || {};
    const flat = {};
    if (state.wilayaFilter === "all") {
      Object.keys(val).forEach(wCode => {
        const posts = val[wCode] || {};
        Object.keys(posts).forEach(pid => {
          flat[pid] = { ...posts[pid], _id: pid, _wilayaCode: Number(wCode) };
        });
      });
    } else {
      Object.keys(val).forEach(pid => {
        flat[pid] = { ...val[pid], _id: pid, _wilayaCode: Number(state.wilayaFilter) };
      });
    }
    state.posts = flat;
    renderFeed();
    state.firstLoadDone = true;
  });

  onChildAdded(dataRef, () => {
    if (!state.firstLoadDone) return;
    if (state.wilayaFilter !== "all") showToast(t("toastNewPost"), "info");
    pulseHero();
  }, () => {});
}

function renderFeed() {
  const grid = document.getElementById("feedGrid");
  const empty = document.getElementById("emptyState");
  const now = Date.now();

  let list = Object.values(state.posts).filter(p => {
    if (p.mode !== state.mode) return false;
    if (p.fulfilled) return false;
    if (p.expiresAt && p.expiresAt < now) return false;
    if ((p.flags || 0) >= FLAG_THRESHOLD) return false;
    if (state.categoryFilter !== "all" && p.category !== state.categoryFilter) return false;
    if (state.communeFilter !== "all" && p.commune !== state.communeFilter) return false;
    if (state.search) {
      const hay = `${p.title || ""} ${p.details || ""} ${p.commune || ""}`.toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    const aPinned = a.pinned && (!a.pinnedUntil || a.pinnedUntil > now);
    const bPinned = b.pinned && (!b.pinnedUntil || b.pinnedUntil > now);
    if (aPinned !== bPinned) return aPinned ? -1 : 1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  grid.innerHTML = "";

  if (list.length === 0) {
    empty.classList.remove("hidden");
    empty.classList.add("flex");
    if (window.lucide) lucide.createIcons();
    return;
  }
  empty.classList.add("hidden");
  empty.classList.remove("flex");

  list.forEach(post => grid.appendChild(renderCard(post)));
  if (window.lucide) lucide.createIcons();
}

function setupLogoCanvas() {
  const canvas = document.getElementById("logoCanvas");
  const ctx = canvas.getContext("2d");
  const nodes = [{x:9,y:10,r:4,c:"#1F8A5F"},{x:26,y:14,r:3,c:"#2D7D9A"},{x:15,y:26,r:3.4,c:"#E8935A"}];
  ctx.strokeStyle = "#1F8A5F55";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[1].x, nodes[1].y);
  ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[2].x, nodes[2].y);
  ctx.stroke();
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.c;
    ctx.fill();
  });
}

function setupHeroCanvas() {
  const canvas = document.getElementById("heroCanvas");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h;
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  }
  resize();
  window.addEventListener("resize", resize);

  const N = 22;
  const nodes = Array.from({length: N}, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.0004,
    vy: (Math.random() - 0.5) * 0.0004,
    pulse: Math.random() * Math.PI * 2
  }));
  const palette = ["#1F8A5F", "#2D7D9A", "#E8935A"];

  function frame() {
    ctx.clearRect(0, 0, w, h);
    nodes.forEach(n => {
      if (!reduceMotion) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > 1) n.vx *= -1;
        if (n.y < 0 || n.y > 1) n.vy *= -1;
        n.pulse += 0.01;
      }
    });
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = (a.x - b.x) * w, dy = (a.y - b.y) * h;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = w * 0.16;
        if (dist < maxDist) {
          ctx.strokeStyle = `rgba(31,138,95,${(1 - dist / maxDist) * 0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x * w, a.y * h);
          ctx.lineTo(b.x * w, b.y * h);
          ctx.stroke();
        }
      }
    }
    nodes.forEach((n, i) => {
      const boost = heroPulseFlag && i % 5 === 0 ? 1.8 : 1;
      const r = (2 + Math.sin(n.pulse) * 0.8) * (w / 900) * boost;
      ctx.beginPath();
      ctx.arc(n.x * w, n.y * h, Math.max(r, 1.5), 0, Math.PI * 2);
      ctx.fillStyle = palette[i % palette.length] + "66";
      ctx.fill();
    });
    heroPulseFlag = false;
    requestAnimationFrame(frame);
  }
  frame();
}

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);

  posts: {},
  listenerAttached: false,
  editingId: null,
  editingWilaya: null,
  search: "",
  wilayaFilter: "all"
};

function initAdminRoute() {
  if (location.hash === ADMIN_ROUTE_HASH) openAdminOverlay();
  window.addEventListener("hashchange", () => {
    if (location.hash === ADMIN_ROUTE_HASH) openAdminOverlay();
    else document.getElementById("adminOverlay").classList.add("hidden");
  });
}

function openAdminOverlay() {
  document.getElementById("adminOverlay").classList.remove("hidden");
  applyAdminI18n();
  if (sessionStorage.getItem("nodz_admin_ok") === "1") {
    showAdminDashboard();
  } else {
    document.getElementById("adminGateView").classList.remove("hidden");
    document.getElementById("adminDashboardView").classList.add("hidden");
    document.getElementById("adminPasswordInput").value = "";
    document.getElementById("adminGateError").classList.add("hidden");
  }
  if (window.lucide) lucide.createIcons();
}

function closeAdminOverlay() {
  history.replaceState(null, "", location.pathname + location.search);
  document.getElementById("adminOverlay").classList.add("hidden");
}

async function attemptAdminLogin() {
  const val = document.getElementById("adminPasswordInput").value;
  const hash = await sha256Hex(val);
  if (hash === ADMIN_PASSWORD_HASH) {
    sessionStorage.setItem("nodz_admin_ok", "1");
    showAdminDashboard();
  } else {
    document.getElementById("adminGateError").textContent = t("adminWrongPassword");
    document.getElementById("adminGateError").classList.remove("hidden");
  }
}

function showAdminDashboard() {
  document.getElementById("adminGateView").classList.add("hidden");
  document.getElementById("adminDashboardView").classList.remove("hidden");
  buildAdminWilayaFilter();
  attachAdminListener();
  if (window.lucide) lucide.createIcons();
}

function adminLogout() {
  sessionStorage.removeItem("nodz_admin_ok");
  closeAdminOverlay();
}

function buildAdminWilayaFilter() {
  const sel = document.getElementById("adminWilayaFilter");
  const prev = sel.value || "all";
  sel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "all";
  optAll.textContent = t("adminAllWilayas");
  sel.appendChild(optAll);
  WILAYAS.forEach(w => {
    const o = document.createElement("option");
    o.value = w.c;
    o.textContent = `${w.c} — ${state.lang === "ar" ? w.ar : w.fr}`;
    sel.appendChild(o);
  });
  sel.value = prev;
}

function attachAdminListener() {
  if (adminState.listenerAttached) { renderAdminList(); return; }
  adminState.listenerAttached = true;
  onValue(ref(db, "posts"), snapshot => {
    const val = snapshot.val() || {};
    const flat = {};
    Object.keys(val).forEach(wCode => {
      const posts = val[wCode] || {};
      Object.keys(posts).forEach(pid => {
        flat[pid] = { ...posts[pid], _id: pid, _wilayaCode: Number(wCode) };
      });
    });
    adminState.posts = flat;
    renderAdminList();
  });
}

function renderAdminList() {
  const wrap = document.getElementById("adminList");
  if (!wrap || document.getElementById("adminOverlay").classList.contains("hidden")) return;
  const now = Date.now();
  let list = Object.values(adminState.posts);
  if (adminState.wilayaFilter !== "all") list = list.filter(p => p._wilayaCode === Number(adminState.wilayaFilter));
  if (adminState.search) {
    const q = adminState.search.toLowerCase();
    list = list.filter(p => `${p.title || ""} ${p.phone || ""}`.toLowerCase().includes(q));
  }
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  wrap.innerHTML = "";
  if (list.length === 0) {
    wrap.innerHTML = `<p class="text-sm text-inkfaint text-center py-10">${t("adminNoPosts")}</p>`;
    return;
  }

  list.forEach(post => {
    const cat = CATEGORIES.find(c => c.k === post.category) || CATEGORIES[5];
    const isPinned = post.pinned && (!post.pinnedUntil || post.pinnedUntil > now);
    const isExpired = post.expiresAt && post.expiresAt < now;
    const row = document.createElement("div");
    row.className = "bg-white border border-clay2 rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center gap-3";
    row.innerHTML = `
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${post.mode === "request" ? "bg-urgent-50 text-urgent-600" : "bg-moss-50 text-moss-700"}">${t("cat_" + cat.k)}</span>
          ${isPinned ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-spore-50 text-spore-600 flex items-center gap-1"><i data-lucide="pin" class="w-2.5 h-2.5"></i>${t("pinnedLabel")}</span>` : ""}
          ${post.fulfilled ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-clay text-inks">${t("adminFulfilledLabel")}</span>` : ""}
          ${isExpired ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-clay text-inks">${t("adminExpired")}</span>` : ""}
          ${(post.flags || 0) > 0 ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-urgent-50 text-urgent-600">${t("adminFlags")}: ${post.flags}</span>` : ""}
        </div>
        <p class="font-bold text-sm mt-1 truncate">${escapeHtml(post.title || "")}</p>
        <p class="text-xs text-inkfaint mt-0.5">${wilayaName(post._wilayaCode)} · ${communeLabel(post._wilayaCode, post.commune)} · ${post.phone || ""}</p>
      </div>
      <div class="flex items-center gap-1.5 flex-wrap shrink-0">
        <select data-action="adminPin" data-id="${post._id}" data-wc="${post._wilayaCode}" class="text-[11px] font-bold border border-clay2 rounded-lg py-2 px-2 min-h-[36px] bg-cream">
          <option value="">${isPinned ? t("adminUnpin") : t("adminPinFor")}</option>
          ${!isPinned ? `
          <option value="1d">${t("adminPin1d")}</option>
          <option value="3d">${t("adminPin3d")}</option>
          <option value="7d">${t("adminPin7d")}</option>
          <option value="forever">${t("adminPinForever")}</option>` : `<option value="unpin">${t("adminUnpin")}</option>`}
        </select>
        <button data-action="adminEdit" data-id="${post._id}" data-wc="${post._wilayaCode}" class="text-[11px] font-bold bg-moss-50 text-moss-700 px-3 py-2 min-h-[36px] rounded-lg hover:bg-moss-100 transition-colors">${t("adminEdit")}</button>
        <button data-action="adminDelete" data-id="${post._id}" data-wc="${post._wilayaCode}" class="text-[11px] font-bold bg-urgent-50 text-urgent-600 px-3 py-2 min-h-[36px] rounded-lg hover:bg-urgent-100 transition-colors">${t("adminDelete")}</button>
      </div>
    `;
    wrap.appendChild(row);
  });
  if (window.lucide) lucide.createIcons();
}

function pinUntilFor(choice) {
  const now = Date.now();
  switch (choice) {
    case "1d": return now + 24 * 3600e3;
    case "3d": return now + 3 * 24 * 3600e3;
    case "7d": return now + 7 * 24 * 3600e3;
    case "forever": return null;
    default: return null;
  }
}

document.getElementById("adminList").addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id, wc = btn.dataset.wc;
  const postRef = ref(db, `posts/${wc}/${id}`);
  if (btn.dataset.action === "adminDelete") {
    if (!confirm(t("adminDeleteConfirm"))) return;
    remove(postRef).then(() => showToast(t("adminDeleted"), "info"));
  } else if (btn.dataset.action === "adminEdit") {
    openAdminEdit(adminState.posts[id]);
  }
});

document.getElementById("adminList").addEventListener("change", e => {
  const sel = e.target.closest("select[data-action='adminPin']");
  if (!sel) return;
  const id = sel.dataset.id, wc = sel.dataset.wc;
  const postRef = ref(db, `posts/${wc}/${id}`);
  const choice = sel.value;
  if (!choice) return;
  if (choice === "unpin") {
    update(postRef, { pinned: false, pinnedUntil: null }).then(() => showToast(t("adminUnpinned"), "info"));
  } else {
    update(postRef, { pinned: true, pinnedUntil: pinUntilFor(choice) }).then(() => showToast(t("adminPinned"), "success"));
  }
});

document.getElementById("adminSearchInput").addEventListener("input", e => {
  adminState.search = e.target.value.trim();
  renderAdminList();
});
document.getElementById("adminWilayaFilter").addEventListener("change", e => {
  adminState.wilayaFilter = e.target.value;
  renderAdminList();
});

document.getElementById("adminUnlockBtn").addEventListener("click", attemptAdminLogin);
document.getElementById("adminPasswordInput").addEventListener("keydown", e => {
  if (e.key === "Enter") attemptAdminLogin();
});
document.getElementById("adminExitBtn1").addEventListener("click", closeAdminOverlay);
document.getElementById("adminExitBtn2").addEventListener("click", closeAdminOverlay);
document.getElementById("adminLogoutBtn").addEventListener("click", adminLogout);

function buildAdminEditSelects() {
  const catSel = document.getElementById("adminEditCategorySelect");
  catSel.innerHTML = "";
  CATEGORIES.forEach(c => {
    const o = document.createElement("option");
    o.value = c.k;
    o.textContent = t("cat_" + c.k);
    catSel.appendChild(o);
  });
  const wSel = document.getElementById("adminEditWilayaSelect");
  wSel.innerHTML = "";
  WILAYAS.forEach(w => {
    const o = document.createElement("option");
    o.value = w.c;
    o.textContent = `${w.c} — ${state.lang === "ar" ? w.ar : w.fr}`;
    wSel.appendChild(o);
  });
}

function openAdminEdit(post) {
  if (!post) return;
  adminState.editingId = post._id;
  adminState.editingWilaya = post._wilayaCode;
  buildAdminEditSelects();
  document.getElementById("adminEditTitleInput").value = post.title || "";
  document.getElementById("adminEditDetailsInput").value = post.details || "";
  document.getElementById("adminEditCategorySelect").value = post.category || "other";
  document.getElementById("adminEditWilayaSelect").value = post._wilayaCode;
  populateCommuneSelect(document.getElementById("adminEditCommuneSelect"), post._wilayaCode, false, post.commune);
  document.getElementById("adminEditPhoneInput").value = post.phone || "";
  document.getElementById("adminEditOverlay").classList.remove("hidden");
  if (window.lucide) lucide.createIcons();
}
document.getElementById("adminEditWilayaSelect").addEventListener("change", e => {
  populateCommuneSelect(document.getElementById("adminEditCommuneSelect"), e.target.value, false, null);
});
document.getElementById("adminEditCloseBtn").addEventListener("click", () => {
  document.getElementById("adminEditOverlay").classList.add("hidden");
});

document.getElementById("adminEditForm").addEventListener("submit", e => {
  e.preventDefault();
  const newWilaya = document.getElementById("adminEditWilayaSelect").value;
  const updated = {
    title: document.getElementById("adminEditTitleInput").value.trim(),
    details: document.getElementById("adminEditDetailsInput").value.trim(),
    category: document.getElementById("adminEditCategorySelect").value,
    commune: document.getElementById("adminEditCommuneSelect").value,
    phone: normalizePhone(document.getElementById("adminEditPhoneInput").value.trim())
  };
  const oldWilaya = adminState.editingWilaya;
  const id = adminState.editingId;

  const finish = () => {
    document.getElementById("adminEditOverlay").classList.add("hidden");
    showToast(t("adminUpdated"), "success");
  };

  if (String(newWilaya) !== String(oldWilaya)) {
    const original = adminState.posts[id];
    const merged = { ...original, ...updated };
    delete merged._id; delete merged._wilayaCode;
    remove(ref(db, `posts/${oldWilaya}/${id}`)).then(() => {
      push(ref(db, `posts/${newWilaya}`), merged).then(finish);
    });
  } else {
    update(ref(db, `posts/${oldWilaya}/${id}`), updated).then(finish);
  }
});

function applyAdminI18n() {
  document.getElementById("adminGateTitle").textContent = t("adminTitle");
  document.getElementById("adminGateSub").textContent = t("adminPasswordPrompt");
  document.getElementById("adminPasswordInput").placeholder = t("adminPasswordPlaceholder");
  document.getElementById("adminUnlockBtn").textContent = t("adminUnlock");
  document.getElementById("adminExitBtn1").textContent = t("adminExit");
  document.getElementById("adminDashTitle").textContent = t("adminTitle");
  document.getElementById("adminExitBtn2").textContent = t("adminExit");
  document.getElementById("adminLogoutBtn").textContent = t("adminLogout");
  document.getElementById("adminSearchInput").placeholder = t("adminSearchPlaceholder");
  document.getElementById("adminEditTitleText").textContent = t("adminEditTitle");
  document.getElementById("adminLblTitleField").textContent = t("lblTitleField");
  document.getElementById("adminLblDetails").textContent = t("lblDetails");
  document.getElementById("adminLblCategory").textContent = t("lblCategory");
  document.getElementById("adminLblWilaya").textContent = t("lblWilaya");
  document.getElementById("adminLblCommune").textContent = t("lblCommune");
  document.getElementById("adminLblPhone").textContent = t("lblPhone");
  document.getElementById("adminSaveBtn").textContent = t("adminSave");
  buildAdminWilayaFilter();
  if (!document.getElementById("adminOverlay").classList.contains("hidden")) renderAdminList();
}

setupLogoCanvas();
setupHeroCanvas();
attachPhoneStatsListener();
attachFirebaseListener();
refreshModeStyles();
applyLangToDom();
loadCommunesData();
initAdminRoute();
if (window.lucide) lucide.createIcons();
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  if (window.lucide) lucide.createIcons();
</script>
</body>
